seed: 42
suppress_accumulate_grad_warning: false
do_hpo_tune: false
do_ensemble_train: false
do_ensemble_fit: false
stage: "fit"
ckpt_path: null   # directory searched for checkpoints by resume/test/predict
do_compile: false

compile_kwargs:
  backend: inductor
  dynamic: true
  mode: max-autotune

ensemble:
  size: 16
  cpus_per_worker: 2
  single_device_gpu_fraction_per_member: 1
  scaling:
    strategy: "single_device"
    num_workers: 1      # GPU parallel processes per member
    gpus_per_worker: 1  # GPUs per parallel worker process (>1 for fsdp/deepspeed)
  fit:
    eps: 1e-7           # guards log[s/(1-s)] as s -> 1
    dtype: "float64"    # precision of the weight fit
    rescale_fit_weights: false  # divide event weights by their common mean for the wifi fit only
    method: "l-bfgs"    # torchmin solver
    options:            # torchmin.minimize options
      max_iter: 1000
      disp: 1           # verbosity: 0 silent, 1 final summary, 2 per-iteration
      gtol: 1e-10
      xtol: 1e-10
    # Opt-in diagnostic: re-fit with every tolerance above divided by tolerance_check_factor and
    # warn if any weight moves by more than tolerance_check_pct %
    tolerance_check: false
    tolerance_check_factor: 10.0
    tolerance_check_pct: 5.0

predict:
  out_dir: "predictions"  # relative paths are anchored to datamodule.data_dir
  format: "csv"           # output format; see FORMATS in callbacks/prediction_writer.py
  use_ensemble: false     # score for every trained ensemble member

hpo_tune:
  num_samples: 20
  scheduler:
    _target_: ray.tune.schedulers.ASHAScheduler
    max_t: 50
    grace_period: 5
    reduction_factor: 2

  search_space:
    n_layers: "randint:5,15"
    n_nodes: "qrandint:100,1000,4"
    learning_rate: "loguniform:1e-5,3e-2"

  do_ensemble: false
  monitor: ["val_loss", "val_l1_energy_ws"] # visually inspected calibrate curve.
  cpus_per_worker: 2    # CPU slots claimed per worker
  single_device_gpu_fraction_per_trial: 1
  scaling:
    strategy: "single_device"
    num_workers: 1      # GPU parallel processes per trial
    gpus_per_worker: 1  # GPUs per parallel worker process (>1 for fsdp/deepspeed)

datamodule:
  _target_: nsbi.datasets.balanced.BalancedDataModule
  loader:
    _target_: nsbi.examples.physics.simulation.mcfm.load_arrays
    _partial_: true
    cross_section: null
    features:
      [
        "l1_pt",
        "l1_eta",
        "l1_phi",
        "l1_energy",
        "l2_pt",
        "l2_eta",
        "l2_phi",
        "l2_energy",
        "l3_pt",
        "l3_eta",
        "l3_phi",
        "l3_energy",
        "l4_pt",
        "l4_eta",
        "l4_phi",
        "l4_energy",
      ]
  numerator_events: "/lus/eagle/projects/ScalingHEPAI/nsbi_tutorial_data/h4l_data/sm/ggzz4l_sbi.csv"
  denominator_events: "/lus/eagle/projects/ScalingHEPAI/nsbi_tutorial_data/h4l_data/sm/ggzz4l_bkg.csv"
  sample_size: 10_000_000
  batch_size: 2048
  data_dir: "/lus/eagle/projects/ScalingHEPAI/test_Nathan/nsbi_outputs"
  num_workers: 8
  train_size: 0.6
  val_size: 0.2
  wi_fit_size: 0.0
  test_size: 0.2
  # for `stage: predict` only
  predict_files: null # null scores numerator_events + denominator_events
  predict_sample_size: null # null means every row, in file order
  # null reuses `loader` above, which samples randomly if sample_size is set
  # point this at an order-preserving loader (e.g. mcfm.load_arrays_ordered)
  predict_loader: null

model:
  _target_: nsbi.models.carl.CARL
  n_features: 16
  n_layers: 16
  n_nodes: 1024
  learning_rate: 1e-4

logger:
  csv:
    _target_: lightning.pytorch.loggers.CSVLogger
    save_dir: "./"

trainer:
  _target_: lightning.pytorch.Trainer
  devices: 1
  num_nodes: 1
  max_epochs: 5
  accelerator: gpu

callbacks:
  model_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    monitor: "val_loss"
    mode: "min"
    save_top_k: 5
    filename: "{epoch:02d}-{val_loss:.2f}"
  model_checkpoint2:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    monitor: "train_loss"
    mode: "min"
    save_top_k: 1
    filename: "{epoch:02d}-{train_loss:.2f}"
  early_stopping:
    _target_: lightning.pytorch.callbacks.EarlyStopping
    monitor: "val_loss"
    patience: 20
    mode: "min"
  closure_metrics:
    _target_: nsbi.callbacks.closure_metrics.ClosureMetricsCallback
    plot: false
    plot_dir: "closure_plots"   # relative paths are anchored to trainer.default_root_dir
    feature_names:
      [
        "l1_pt",
        "l1_eta",
        "l1_phi",
        "l1_energy",
        "l2_pt",
        "l2_eta",
        "l2_phi",
        "l2_energy",
        "l3_pt",
        "l3_eta",
        "l3_phi",
        "l3_energy",
        "l4_pt",
        "l4_eta",
        "l4_phi",
        "l4_energy",
      ]
